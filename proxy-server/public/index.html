<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Br Br Hub</title>
  <meta name="theme-color" content="#0b0716">
  <link rel="icon" type="image/avif" href="/brr.avif">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Space+Grotesk:wght@400;500;600&display=swap">

  <!-- Proxy engine (Scramjet). Do not remove. -->
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>

  <style>
    :root {
      --bg: #0b0716; --bg-raise: #140d26; --surface: #1b1233; --surface-hi: #261a46;
      --line: #34255c; --text: #f4efff; --dim: #b9acd9; --faint: #8676ad;
      --accent: #b36bff; --accent-2: #ff4fd8; --accent-3: #33e6ff; --danger: #ff7a9c;
      --grad: linear-gradient(120deg, var(--accent), var(--accent-2) 55%, var(--accent-3));
      --font: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      --display: "Rubik", var(--font);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); display: flex; flex-direction: column; }
    button { font: inherit; color: inherit; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Tab strip ---------- */
    .tabs { display: flex; align-items: flex-end; gap: 4px; padding: 8px 8px 0; background: #07040f; flex: none; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; display: flex; align-items: center; gap: 8px; flex: 0 1 220px; min-width: 110px; height: 38px;
      padding: 0 8px 0 12px; border-radius: 12px 12px 0 0; background: transparent; border: 0; cursor: pointer;
      color: var(--dim); text-align: left; transition: background .15s, color .15s;
    }
    .tab:hover { background: var(--bg-raise); color: var(--text); }
    .tab.is-active { background: var(--surface); color: var(--text); }
    .tab.is-active::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--grad); }
    .tab__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
    .tab.is-loading .tab__dot { background: var(--accent-2); animation: pulse .9s ease-in-out infinite; }
    .tab.is-active .tab__dot { background: var(--accent-3); }
    @keyframes pulse { 50% { opacity: .3; } }
    .tab__title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 13.5px; }
    .tab__close { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; flex: none; opacity: .65; }
    .tab__close:hover { background: var(--surface-hi); opacity: 1; }
    .tab__close svg { width: 13px; height: 13px; }
    .newtab { display: grid; place-items: center; width: 34px; height: 34px; margin-bottom: 2px; border-radius: 10px; border: 0; background: transparent; color: var(--dim); cursor: pointer; flex: none; }
    .newtab:hover { background: var(--bg-raise); color: var(--text); }

    /* ---------- Toolbar ---------- */
    .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
    .tool { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--dim); cursor: pointer; flex: none; }
    .tool:hover:not(:disabled) { background: var(--surface-hi); color: var(--text); }
    .tool:disabled { opacity: .35; cursor: default; }
    .tool.is-spinning svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .omni { flex: 1; min-width: 0; display: flex; }
    .omni input {
      width: 100%; height: 38px; padding: 0 16px; border-radius: 999px; outline: none;
      background: var(--bg-raise); border: 1px solid var(--line); color: var(--text); font: inherit;
    }
    .omni input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(255,79,216,.18); }

    /* ---------- Content ---------- */
    .views { position: relative; flex: 1; min-height: 0; }
    .view { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    .view[hidden] { display: none; }

    /* New-tab page */
    .home {
      position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px; text-align: center;
      background:
        radial-gradient(800px 500px at 15% -10%, rgba(179,107,255,.28), transparent 70%),
        radial-gradient(700px 480px at 90% 10%, rgba(255,79,216,.18), transparent 70%),
        radial-gradient(900px 600px at 50% 115%, rgba(51,230,255,.14), transparent 70%),
        var(--bg);
    }
    .home[hidden] { display: none; }
    .mark { position: relative; overflow: hidden; width: 72px; height: 72px; border-radius: 22px; background: var(--grad); color: #fff;
            display: grid; place-items: center; font: 800 38px var(--display); margin-bottom: 16px;
            box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset, 0 14px 40px -10px rgba(255,79,216,.8);
            animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px) rotate(-4deg); } }
    .mark img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .mark.has-img .sigma { visibility: hidden; }
    .home h1 { margin: 0 0 6px; font: 800 clamp(40px, 8vw, 72px)/1.05 var(--display); letter-spacing: -.02em;
         background: linear-gradient(100deg, #fff 5%, var(--accent) 40%, var(--accent-2) 70%, var(--accent-3));
         -webkit-background-clip: text; background-clip: text; color: transparent; }
    .home .sub { margin: 0 0 28px; color: var(--dim); font-size: 18px; }
    .home form { width: min(660px, 100%); display: flex; gap: 8px; padding: 6px; border-radius: 999px;
           background: rgba(27,18,51,.85); border: 1px solid var(--line);
           box-shadow: 0 18px 50px -20px rgba(179,107,255,.6); }
    .home form:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 4px rgba(255,79,216,.18), 0 18px 50px -20px rgba(179,107,255,.6); }
    .home input { flex: 1; min-width: 0; background: transparent; color: var(--text); border: 0; padding: 12px 18px; font: inherit; font-size: 17px; outline: none; }
    .home input::placeholder { color: var(--faint); }
    .go { background: var(--grad); color: #fff; border: 0; border-radius: 999px; padding: 0 28px;
          font: 800 17px var(--display); cursor: pointer; box-shadow: 0 8px 22px -8px rgba(255,79,216,.9); transition: transform .15s, filter .15s; }
    .go:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .go:active { transform: scale(.96); }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; max-width: 660px; }
    .chip { background: rgba(27,18,51,.8); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
            padding: 9px 16px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform .15s, border-color .15s, background .15s; }
    .chip:hover { background: var(--surface-hi); border-color: var(--accent-2); transform: translateY(-2px); }

    /* Settings panel */
    .gear { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--dim); cursor: pointer; flex: none; }
    .gear:hover { background: var(--surface-hi); color: var(--text); }
    .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(5,3,12,.65); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .sheet[hidden] { display: none; }
    .card { width: min(480px, 100%); max-height: 90vh; overflow: auto; padding: 20px; border-radius: 20px; background: var(--bg-raise); border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(0,0,0,.9); }
    .card h2 { margin: 0 0 4px; font: 800 22px var(--display); }
    .card h3 { margin: 18px 0 6px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
    .card label { display: block; margin: 8px 0 3px; font-size: 13px; color: var(--dim); }
    .card select { width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--line); font: inherit; }
    .card select:focus { outline: none; border-color: var(--accent-2); }
    .card .hint { margin: 4px 0 0; font-size: 12.5px; color: var(--faint); }
    .card .row { display: flex; gap: 8px; margin-top: 18px; }
    .card .btn { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 600 14px var(--font); cursor: pointer; }
    .card .btn.main { background: var(--grad); border-color: transparent; color: #fff; }
    .error { color: var(--danger); min-height: 1.4em; margin: 18px 0 0; max-width: 660px; }
    .note { margin-top: 26px; font-size: 13px; color: var(--faint); max-width: 520px; }
    .note a { color: var(--dim); }

    @media (max-width: 560px) {
      .tab { flex-basis: 140px; min-width: 90px; }
      .tool.hide-sm { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <nav class="tabs" id="tabs" aria-label="Tabs">
    <button class="newtab" id="newtab" type="button" title="New tab" aria-label="New tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <div class="toolbar">
    <button class="tool" id="back" type="button" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="tool" id="forward" type="button" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="tool" id="reload" type="button" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="tool hide-sm" id="home" type="button" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
    <form class="omni" id="omni" autocomplete="off">
      <input id="address" type="text" placeholder="Search or enter a website" aria-label="Address" spellcheck="false">
    </form>
    <button class="gear" id="gear" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-label="Br Br Hub settings">
      <h2>Br Br Hub settings</h2>
      <p class="hint">Saved in this browser only.</p>

      <h3>Search</h3>
      <label for="s-search">Search engine for typed words</label>
      <select id="s-search">
        <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
        <option value="https://www.bing.com/search?q=%s">Bing</option>
        <option value="https://search.brave.com/search?q=%s">Brave Search</option>
        <option value="https://www.google.com/search?q=%s">Google (often shows a robot check)</option>
      </select>

      <div class="row">
        <button class="btn main" id="s-save" type="button">Save</button>
        <button class="btn" id="s-reset" type="button">Reset</button>
        <button class="btn" id="s-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <main class="views" id="views">
    <section class="home" id="homepage">
      <!-- Logo: shows /brr.avif when that file exists on the server, otherwise the sigma -->
      <div class="mark" id="mark" aria-hidden="true"><span class="sigma">&sum;</span><img id="markimg" src="/brr.avif" alt="" onload="document.getElementById('mark').classList.add('has-img')" onerror="this.remove()"></div>
      <h1>Br Br Hub</h1>
      <p class="sub">Type a website or search.</p>
      <form id="homeform" autocomplete="off">
        <input id="homeinput" type="text" placeholder="Search or enter a website" aria-label="Search or enter a website" spellcheck="false">
        <button class="go" type="submit">Go</button>
      </form>
      <div class="chips" id="chips">
        <button class="chip" type="button" data-go="https://duckduckgo.com/">DuckDuckGo</button>
        <button class="chip" type="button" data-go="https://en.wikipedia.org/">Wikipedia</button>
        <button class="chip" type="button" data-go="https://www.bing.com/">Bing</button>
        <button class="chip" type="button" data-go="https://www.youtube.com/">YouTube</button>
      </div>
      <p class="error" id="error" role="alert"></p>
      <p class="note">Some sites block this or won't load. Use it only where your network's rules allow it. · Powered by <a href="https://github.com/MercuryWorkshop/scramjet">Scramjet</a> · <a href="/credits.html">Credits</a></p>
    </section>
  </main>

  <!-- search(): turns what you type into a web address or a search -->
  <script src="/search.js"></script>

  <script>
  (function () {
    'use strict';
    var SEARCH = 'https://duckduckgo.com/?q=%s';

    var $ = function (id) { return document.getElementById(id); };
    var tabsEl = $('tabs'), views = $('views'), home = $('homepage');
    var address = $('address'), errorEl = $('error');

    // ----- Engine setup -----
    var connection = new BareMux.BareMuxConnection('/baremux/worker.js');
    var sjController = null;
    var ready = null;

    // Resolve once the service worker that covers this path is active.
    async function waitActive(path) {
      var reg = await navigator.serviceWorker.getRegistration(location.origin + path);
      if (!reg) return;
      var sw = reg.installing || reg.waiting || reg.active;
      if (!sw || sw.state === 'activated') return;
      await new Promise(function (resolve) {
        var check = function () { if (sw.state === 'activated' || sw.state === 'redundant') resolve(); };
        sw.addEventListener('statechange', check);
        check();
      });
    }

    // Remove Scramjet's service worker and its local database(s) so it can start clean.
    async function resetScramjetStorage() {
      try {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < regs.length; i++) {
          if (regs[i].scope === location.origin + '/') await regs[i].unregister();
        }
      } catch (e) {}
      try {
        if (indexedDB.databases) {
          var dbs = await indexedDB.databases();
          for (var j = 0; j < dbs.length; j++) {
            if (dbs[j].name && /scramjet/i.test(dbs[j].name)) {
              await new Promise(function (resolve) {
                var q = indexedDB.deleteDatabase(dbs[j].name);
                q.onsuccess = q.onerror = q.onblocked = function () { resolve(); };
              });
            }
          }
        }
      } catch (e) {}
    }

    function ensureReady() {
      if (!ready) {
        ready = (async function () {
          if (typeof $scramjetLoadController !== 'function') {
            throw new Error('the engine files are missing on the server');
          }
          if (!navigator.serviceWorker) {
            throw new Error(location.protocol !== 'https:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
              ? 'service workers cannot run without https'
              : "your browser doesn't support service workers");
          }
          if (!sjController) {
            // Start the controller BEFORE registering the service worker (the worker can otherwise
            // create the database half-finished, which causes "object store not found").
            // If the database is already broken, delete it and retry once.
            var C = $scramjetLoadController().ScramjetController;
            var makeController = async function () {
              sjController = new C({ files: { wasm: '/scram/scramjet.wasm.wasm', all: '/scram/scramjet.all.js', sync: '/scram/scramjet.sync.js' } });
              await sjController.init();
            };
            try {
              await makeController();
            } catch (e) {
              sjController = null;
              await resetScramjetStorage();
              await makeController();
            }
          }
          await navigator.serviceWorker.register('/sw.js', { scope: '/' });
          // A worker that is registered but not yet active can't intercept the first page load,
          // which would then go to the server as a normal (404) request.
          await waitActive('/scramjet/');
          var wisp = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/';
          if ((await connection.getTransport()) !== '/libcurl/index.mjs') {
            await connection.setTransport('/libcurl/index.mjs', [{ websocket: wisp }]);
          }
        })();
        ready.catch(function () { ready = null; });
      }
      return ready;
    }

    // ----- Tabs -----
    var tabs = [];
    var active = null;
    var nextId = 1;

    function makeTab(url, activate) {
      var t = { id: nextId++, url: '', title: 'New tab', frame: null, sjframe: null, el: null, loading: false };
      var el = document.createElement('div');
      el.className = 'tab';
      el.setAttribute('role', 'tab');
      el.tabIndex = 0;
      el.innerHTML = '<span class="tab__dot"></span><span class="tab__title"></span>' +
        '<span class="tab__close" role="button" aria-label="Close tab" title="Close tab"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>';
      el.addEventListener('click', function (e) {
        if (e.target.closest('.tab__close')) { closeTab(t); return; }
        select(t);
      });
      el.addEventListener('auxclick', function (e) { if (e.button === 1) closeTab(t); });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(t); } });
      t.el = el;
      tabsEl.insertBefore(el, $('newtab'));
      tabs.push(t);
      paint(t);
      if (activate !== false) select(t);
      if (url) navigate(t, url);
      return t;
    }

    function paint(t) {
      t.el.querySelector('.tab__title').textContent = t.title || t.url || 'New tab';
      t.el.title = t.url || t.title || 'New tab';
      t.el.classList.toggle('is-active', t === active);
      t.el.classList.toggle('is-loading', !!t.loading);
    }

    function select(t) {
      active = t;
      tabs.forEach(function (x) {
        paint(x);
        if (x.frame) x.frame.hidden = x !== t;
      });
      home.hidden = !!t.frame;
      address.value = t.url;
      updateButtons();
      if (!t.frame) setTimeout(function () { $('homeinput').focus(); }, 0);
      t.el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    function closeTab(t) {
      var i = tabs.indexOf(t);
      if (i < 0) return;
      if (t.frame) t.frame.remove();
      t.el.remove();
      tabs.splice(i, 1);
      if (!tabs.length) { makeTab(); return; }
      if (active === t) select(tabs[Math.min(i, tabs.length - 1)]);
    }

    async function navigate(t, input) {
      errorEl.textContent = '';
      var url = search(String(input).trim(), (settings && settings.search) || SEARCH);
      try {
        await ensureReady();
      } catch (err) {
        errorEl.textContent = 'Br Br Hub could not start: ' + (err && err.message ? err.message : err) + '.';
        return;
      }
      if (!t.sjframe) {
        t.sjframe = sjController.createFrame();
        var f = t.sjframe.frame;
        f.className = 'view';
        f.setAttribute('allow', 'fullscreen; clipboard-read; clipboard-write; autoplay; encrypted-media');
        f.addEventListener('load', function () { onFrameLoad(t); });
        views.appendChild(f);
        t.frame = f;
      }
      t.url = url;
      t.title = url.replace(/^https?:\/\//, '');
      t.loading = true;
      t.sjframe.go(url);
      if (t === active) select(t); else paint(t);
    }

    // Read the real address and title of the page inside the tab.
    function sync(t) {
      if (!t.frame) return;
      try {
        var su = t.sjframe && t.sjframe.url;
        if (su) t.url = String(su.href || su);
        var w = t.frame.contentWindow;
        var title = w && w.document && w.document.title;
        if (title) t.title = title;
      } catch (e) {}
      paint(t);
      if (t === active && document.activeElement !== address) address.value = t.url;
      if (t === active) updateButtons();
    }

    function onFrameLoad(t) {
      t.loading = false;
      $('reload').classList.remove('is-spinning');
      sync(t);
    }

    // Keep the address bar and tab titles fresh (sites change them without reloading).
    setInterval(function () { tabs.forEach(sync); }, 800);

    // ----- Toolbar -----
    function updateButtons() {
      var has = !!(active && active.frame);
      $('back').disabled = !has;
      $('forward').disabled = !has;
      $('reload').disabled = !has;
    }

    $('back').addEventListener('click', function () {
      try {
        if (active.sjframe && active.sjframe.back) active.sjframe.back();
        else active.frame.contentWindow.history.back();
      } catch (e) {}
    });
    $('forward').addEventListener('click', function () {
      try {
        if (active.sjframe && active.sjframe.forward) active.sjframe.forward();
        else active.frame.contentWindow.history.forward();
      } catch (e) {}
    });
    $('reload').addEventListener('click', function () {
      var t = active;
      if (!t || !t.sjframe) return;
      this.classList.add('is-spinning');
      t.loading = true; paint(t);
      try {
        if (t.sjframe.reload) t.sjframe.reload();
        else if (t.url) t.sjframe.go(t.url);
      } catch (e) {}
      var btn = this;
      setTimeout(function () { btn.classList.remove('is-spinning'); }, 8000);
    });
    $('home').addEventListener('click', function () {
      if (!active || !active.frame) return;
      active.frame.remove(); active.frame = null; active.sjframe = null;
      active.url = ''; active.title = 'New tab'; active.loading = false;
      select(active);
    });
    $('newtab').addEventListener('click', function () { makeTab(); });

    // ----- Settings -----
    var DEFAULTS = { search: SEARCH };
    var settings = Object.assign({}, DEFAULTS);
    try { Object.assign(settings, JSON.parse(localStorage.getItem('proxy:settings') || '{}')); } catch (e) {}

    var sheet = $('sheet');
    function openSettings() {
      $('s-search').value = settings.search;
      sheet.hidden = false;
    }
    function saveSettings() {
      settings = { search: $('s-search').value };
      try { localStorage.setItem('proxy:settings', JSON.stringify(settings)); } catch (e) {}
      sheet.hidden = true;
    }
    $('gear').addEventListener('click', openSettings);
    $('s-save').addEventListener('click', saveSettings);
    $('s-close').addEventListener('click', function () { sheet.hidden = true; });
    $('s-reset').addEventListener('click', function () {
      settings = Object.assign({}, DEFAULTS);
      try { localStorage.removeItem('proxy:settings'); } catch (e) {}
      openSettings();
    });
    sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.hidden = true; });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') sheet.hidden = true; });

    function go(value) { if (active) navigate(active, value); }

    $('omni').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!address.value.trim()) return;
      address.blur();
      go(address.value);
    });
    $('homeform').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('homeinput').value.trim();
      if (!v) return;
      $('homeinput').value = '';
      go(v);
    });
    $('chips').addEventListener('click', function (e) {
      var b = e.target.closest('[data-go]');
      if (b) go(b.getAttribute('data-go'));
    });
    address.addEventListener('focus', function () { address.select(); });

    // Keyboard shortcuts that don't clash with the browser: Alt+T new tab, Alt+W close tab.
    document.addEventListener('keydown', function (e) {
      if (!e.altKey || e.ctrlKey || e.metaKey) return;
      var k = e.key.toLowerCase();
      if (k === 't') { e.preventDefault(); makeTab(); }
      else if (k === 'w' && active) { e.preventDefault(); closeTab(active); }
    });

    makeTab();
    ensureReady().catch(function (err) {
      errorEl.textContent = 'Br Br Hub could not start: ' + (err && err.message ? err.message : err) + '.';
    });
  })();
  </script>
</body>
</html>
